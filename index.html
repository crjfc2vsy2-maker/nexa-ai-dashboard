<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nexa AI — a concept AI content workspace product. Portfolio project by Vladyslav; not a real product or service."
    />
    <meta name="color-scheme" content="dark light" />
    <title>Dashboard · Nexa AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#viewRoot">Skip to content</a>

    <div class="app-shell" id="appShell">
      <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span class="brand-name">Nexa<span class="brand-name__accent">AI</span></span>
        </div>

        <nav class="sidebar__nav" id="sidebarNav" aria-label="Primary"></nav>

        <div class="sidebar__foot">
          <div class="workspace-chip">
            <span class="workspace-chip__dot" aria-hidden="true"></span>
            <span class="sidebar__label">Brightloop Studio</span>
          </div>
          <button type="button" class="sidebar__collapse" id="sidebarCollapseBtn" aria-label="Collapse sidebar"></button>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <button type="button" class="icon-button topbar__menu" id="mobileNavToggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"></button>

          <form class="search-field topbar__search" id="globalSearchForm" role="search">
            <span id="searchIconSlot" aria-hidden="true"></span>
            <input type="search" id="globalSearch" placeholder="Search projects, templates… (press /)" aria-label="Search Nexa AI" />
          </form>

          <div class="topbar__actions">
            <div class="dropdown" data-dropdown>
              <button type="button" class="icon-button" id="notifBellBtn" data-dropdown-trigger aria-haspopup="true" aria-expanded="false" aria-label="Notifications"></button>
              <div class="dropdown__panel dropdown__panel--right dropdown__panel--wide" data-dropdown-panel id="notifPreview"></div>
            </div>

            <div class="dropdown" data-dropdown>
              <button type="button" class="account-trigger" id="accountTrigger" data-dropdown-trigger aria-haspopup="true" aria-expanded="false"></button>
              <div class="dropdown__panel dropdown__panel--right" data-dropdown-panel id="accountPanel" role="menu"></div>
            </div>
          </div>
        </header>

        <main class="content" id="viewRoot" tabindex="-1" aria-live="polite"></main>

        <footer class="app-footer">
          <p>
            Nexa AI is a <strong>concept product</strong> — a portfolio piece with no real backend, accounts, or AI
            model behind it. Built by
            <a href="https://crjfc2vsy2-maker.github.io/portfolio/" target="_blank" rel="noreferrer">Vladyslav</a>.
          </p>
        </footer>
      </div>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/views/dashboard.js"></script>
    <script src="js/views/projects.js"></script>
    <script src="js/views/generator.js"></script>
    <script src="js/views/history.js"></script>
    <script src="js/views/analytics.js"></script>
    <script src="js/views/templates.js"></script>
    <script src="js/views/notifications.js"></script>
    <script src="js/views/settings.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
